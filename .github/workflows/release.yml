name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches plugin version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          header=$(sed -n 's/^ \* Version:[[:space:]]*//p' dynamic-location-menus.php | tr -d '\r')
          constant=$(sed -n "s/^define('DLM_VERSION', '\(.*\)');/\1/p" dynamic-location-menus.php | tr -d '\r')
          stable=$(sed -n 's/^Stable tag:[[:space:]]*//p' readme.txt | tr -d '\r')
          echo "tag=$tag header=$header constant=$constant stable=$stable"
          if [ "$tag" != "$header" ] || [ "$tag" != "$constant" ] || [ "$tag" != "$stable" ]; then
            echo "::error::Tag v$tag does not match plugin header / DLM_VERSION / readme Stable tag."
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Lint and test before packaging
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction
          composer lint
          composer test

      - name: Create wp-dynamic-location-menus.zip
        run: bash bin/build-zip.sh

      - name: Write release notes
        run: bash bin/release-notes.sh "${GITHUB_REF_NAME#v}" dynamic-location-menus.php release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: wp-dynamic-location-menus.zip
          body_path: release-notes.md
          generate_release_notes: true
