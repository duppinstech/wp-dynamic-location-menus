name: CI

on:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Lint
        run: composer lint

      - name: Test
        run: composer test

      - name: Release notes for the current version
        run: |
          set -euo pipefail
          version=$(sed -n 's/^ \* Version:[[:space:]]*//p' dynamic-location-menus.php | tr -d '\r')
          bash bin/release-notes.sh "$version" dynamic-location-menus.php "$RUNNER_TEMP/release-notes.md"
